# Sarabun PDF API Configuration
# แปลงมาจาก: appsettings.json ใน .NET project

# Application Info
spring.application.name=Sarabun PDF API
app.version=1.0.0

# Server Configuration
server.port=8888

# ============================================
# Tomcat Thread Pool Configuration (Scalability)
# ============================================
# จำนวน thread สูงสุดที่ Tomcat จะสร้าง (default: 200)
# เพิ่มเพื่อรองรับ concurrent requests มากขึ้น
server.tomcat.threads.max=500

# จำนวน thread ขั้นต่ำที่จะ keep alive (default: 10)
server.tomcat.threads.min-spare=50

# จำนวน requests ที่จะ queue ไว้รอถ้า thread เต็ม (default: 100)
server.tomcat.accept-count=200

# จำนวน connections สูงสุดที่ server จะรับ (default: 8192)
server.tomcat.max-connections=20000

# Connection timeout (milliseconds) - default: 20000 (20 seconds)
server.tomcat.connection-timeout=30000

# Keep-alive timeout (milliseconds)
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100

# ============================================
# API Security Configuration
# ============================================
# เปิด/ปิด API Key authentication
# - false (default): ไม่ต้องใช้ API Key (สำหรับ development)
# - true: ต้องใช้ API Key (สำหรับ production)
api.security.enabled=false

# API Key สำหรับ authentication
# วิธีสร้าง: openssl rand -hex 32
# ควรตั้งผ่าน environment variable แทนการใส่ในไฟล์นี้
# เช่น: API_KEY=your-secret-key-here
api.key=${API_KEY:}

# Logging
# Production: ใช้ INFO เพื่อไม่ให้ log ข้อมูล sensitive
# Development: เปลี่ยนเป็น DEBUG ถ้าต้องการ debug
logging.level.root=INFO
logging.level.th.go.etda.sarabun.pdf=INFO

# Jackson JSON
spring.jackson.default-property-inclusion=non_null

# File Upload
# จำกัดขนาดไฟล์ให้สอดคล้องกับ validation.max-content-length (~500KB)
# ป้องกัน large request DoS attack
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# PDF Settings
pdf.temp-directory=${java.io.tmpdir}/sarabun_pdf_files

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ============================================
# Actuator (Health Check & Kubernetes Probes)
# ============================================
# เปิด endpoints: health, info, prometheus (ถ้าต้องการ metrics)
management.endpoints.web.exposure.include=health,info

# แสดง health details เมื่อมี authorization
management.endpoint.health.show-details=when_authorized

# เปิด health indicators พื้นฐาน
management.health.defaults.enabled=true

# เปิด Liveness & Readiness Probes สำหรับ Kubernetes/Cloud Foundry
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Liveness Probe - ตรวจว่า app ยังมีชีวิตอยู่หรือไม่ (ถ้า fail จะ restart pod)
# Endpoint: /actuator/health/liveness
# Kubernetes example:
#   livenessProbe:
#     httpGet:
#       path: /actuator/health/liveness
#       port: 8888
#     initialDelaySeconds: 30
#     periodSeconds: 10

# Readiness Probe - ตรวจว่า app พร้อมรับ traffic หรือไม่ (ถ้า fail จะไม่ route traffic มา)
# Endpoint: /actuator/health/readiness
# Kubernetes example:
#   readinessProbe:
#     httpGet:
#       path: /actuator/health/readiness
#       port: 8888
#     initialDelaySeconds: 10
#     periodSeconds: 5

# ============================================
# Rate Limiting Configuration (Scalability)
# ============================================
# เปิด/ปิด Rate Limiting (default: true)
ratelimit.enabled=true

# Global limit: จำนวน requests ทั้งระบบต่อนาที
# เพิ่มจาก 100 เป็น 500 เพื่อรองรับ load สูงขึ้น
ratelimit.global.requests-per-minute=500

# Per-IP limit: จำนวน requests ต่อ IP ต่อนาที
# เพิ่มจาก 100 เป็น 200 สำหรับ power users
ratelimit.per-ip.requests-per-minute=200

# Burst capacity: จำนวน requests สูงสุดที่ IP สามารถส่งรัวๆ ได้
# เพิ่มจาก 50 เป็น 100 เพื่อรองรับ batch operations
ratelimit.per-ip.burst-capacity=100

# ============================================
# Input Validation Configuration
# ============================================
# เปิด/ปิด Validation (default: true)
validation.enabled=true

# ขนาดสูงสุดของ content (ตัวอักษร) - default: 500,000 chars (~500KB)
validation.max-content-length=500000

# ขนาดสูงสุดของ Base64 signature (bytes) - default: 10MB
validation.max-base64-size=10485760

# จำนวนผู้ลงนามสูงสุด
validation.max-signers=20

# จำนวนผู้รับสูงสุด
validation.max-recipients=100

# จำนวน attachments สูงสุด
validation.max-attachments=50
