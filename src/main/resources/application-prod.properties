# ============================================
# Production Profile Configuration
# ============================================
# ใช้สำหรับ: production environment
#
# วิธีใช้:
#   java -jar app.jar --spring.profiles.active=prod
#   หรือ
#   docker run -e SPRING_PROFILES_ACTIVE=prod -e API_KEY=xxx ...
#
# *** สำคัญ ***
# ต้องตั้งค่า API_KEY ผ่าน environment variable:
#   export API_KEY=your-64-character-hex-string-here
#   หรือใน docker: -e API_KEY=xxx

# เปิด API Key authentication สำหรับ production
api.security.enabled=true

# API Key - ต้องตั้งผ่าน environment variable
# ห้ามใส่ค่าจริงในไฟล์นี้!
api.key=${API_KEY}

# Logging - ใช้ INFO สำหรับ production
logging.level.root=INFO
logging.level.th.go.etda.sarabun.pdf=INFO

# ปิด debug features
# debug=false
