<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PDF API Tester - Sarabun PDF Generator</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                max-width: 1600px;
                margin: 0 auto;
            }

            h1 {
                color: white;
                text-align: center;
                margin-bottom: 15px;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
                font-size: 24px;
            }

            .panel {
                background: white;
                border-radius: 12px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                overflow: hidden;
                margin-bottom: 15px;
            }

            .panel-header {
                background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
                color: white;
                padding: 12px 20px;
                font-weight: bold;
                font-size: 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .panel-body {
                padding: 15px 20px;
            }

            /* Request Panel - Horizontal Layout */
            .request-row {
                display: flex;
                gap: 15px;
                align-items: flex-start;
            }

            .request-left {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .request-right {
                flex: 2;
            }

            .form-row {
                display: flex;
                gap: 15px;
            }

            .form-group {
                margin-bottom: 0;
                flex: 1;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: 600;
                color: #4a5568;
                font-size: 13px;
            }

            select,
            input[type="text"] {
                width: 100%;
                padding: 8px 10px;
                border: 2px solid #e2e8f0;
                border-radius: 6px;
                font-size: 13px;
                transition: border-color 0.3s;
            }

            select:focus,
            input[type="text"]:focus {
                outline: none;
                border-color: #667eea;
            }

            textarea {
                width: 100%;
                height: 180px;
                padding: 10px;
                border: 2px solid #e2e8f0;
                border-radius: 6px;
                font-family: "Consolas", "Monaco", monospace;
                font-size: 12px;
                line-height: 1.4;
                resize: vertical;
                transition: border-color 0.3s;
            }

            textarea:focus {
                outline: none;
                border-color: #667eea;
            }

            .btn-group {
                display: flex;
                gap: 8px;
            }

            .btn {
                padding: 10px 20px;
                border: none;
                border-radius: 6px;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
            }

            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            }

            .btn-secondary {
                background: #e2e8f0;
                color: #4a5568;
            }

            .btn-secondary:hover {
                background: #cbd5e0;
            }

            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none !important;
            }

            /* Response Panel */
            .response-content {
                display: flex;
                gap: 15px;
                height: calc(100vh - 380px);
                min-height: 400px;
            }

            .pdf-section {
                flex: 3;
                display: flex;
                flex-direction: column;
                background: #f7fafc;
                border-radius: 8px;
                overflow: hidden;
            }

            .pdf-section-header {
                background: #4a5568;
                color: white;
                padding: 8px 15px;
                font-weight: 600;
                font-size: 14px;
            }

            .pdf-section-body {
                flex: 1;
                position: relative;
                min-height: 500px;
            }

            #pdfViewer {
                width: 100%;
                height: 100%;
                border: none;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: white;
            }

            .json-section {
                flex: 1;
                display: flex;
                flex-direction: column;
                background: #1a202c;
                border-radius: 8px;
                overflow: hidden;
                min-width: 300px;
                max-width: 500px;
            }

            .json-section-tabs {
                display: flex;
                background: #2d3748;
            }

            .json-tab {
                flex: 1;
                padding: 10px 15px;
                background: transparent;
                border: none;
                color: #a0aec0;
                font-weight: 600;
                font-size: 13px;
                cursor: pointer;
                transition: all 0.2s;
            }

            .json-tab:hover {
                background: rgba(255, 255, 255, 0.1);
            }

            .json-tab.active {
                background: #1a202c;
                color: #68d391;
            }

            .json-tab-content {
                display: none;
                flex: 1;
                overflow: auto;
            }

            .json-tab-content.active {
                display: flex;
                flex-direction: column;
            }

            .json-section-header {
                background: #2d3748;
                color: white;
                padding: 8px 15px;
                font-weight: 600;
                font-size: 14px;
            }

            #jsonResponse {
                flex: 1;
                width: 100%;
                padding: 12px;
                font-family: "Consolas", "Monaco", monospace;
                font-size: 11px;
                background: #1a202c;
                color: #68d391;
                border: none;
                resize: none;
            }

            .status-bar {
                padding: 8px 15px;
                background: #f7fafc;
                border-top: 1px solid #e2e8f0;
                font-size: 12px;
                color: #718096;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .status-bar.success {
                background: #c6f6d5;
                color: #22543d;
            }

            .status-bar.error {
                background: #fed7d7;
                color: #822727;
            }

            .loading-overlay {
                display: none;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(255, 255, 255, 0.9);
                justify-content: center;
                align-items: center;
                flex-direction: column;
                z-index: 10;
            }

            .loading-overlay.active {
                display: flex;
            }

            .spinner {
                width: 50px;
                height: 50px;
                border: 4px solid #e2e8f0;
                border-top-color: #667eea;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-bottom: 15px;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .endpoint-info {
                background: #edf2f7;
                padding: 8px 12px;
                border-radius: 6px;
                font-family: monospace;
                font-size: 12px;
                color: #4a5568;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .method-badge {
                display: inline-block;
                padding: 3px 8px;
                background: #48bb78;
                color: white;
                border-radius: 4px;
                font-weight: bold;
                font-size: 11px;
            }

            .sample-select {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .sample-select label {
                margin-bottom: 0;
                white-space: nowrap;
            }

            .sample-select select {
                width: auto;
                min-width: 200px;
            }

            .no-pdf {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100%;
                color: #a0aec0;
                font-size: 16px;
                flex-direction: column;
                gap: 10px;
            }

            .no-pdf-icon {
                font-size: 48px;
            }

            /* JSON Preview Body */
            .json-preview-body {
                flex: 1;
                overflow: auto;
                padding: 12px;
                font-family: "Consolas", "Monaco", monospace;
                font-size: 12px;
                line-height: 1.5;
                color: #e2e8f0;
            }

            /* JSON Syntax Highlighting */
            .json-key {
                color: #9cdcfe;
            }
            .json-string {
                color: #ce9178;
            }
            .json-number {
                color: #b5cea8;
            }
            .json-boolean {
                color: #569cd6;
            }
            .json-null {
                color: #569cd6;
            }
            .json-bracket {
                color: #ffd700;
            }

            @media (max-width: 1200px) {
                .request-row {
                    flex-direction: column;
                }

                .response-content {
                    flex-direction: column;
                    height: auto;
                }

                .pdf-section,
                .json-section {
                    min-height: 400px;
                    max-width: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🔧 PDF API Tester</h1>

            <!-- Request Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>📤 Request</span>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="sendRequest()">🚀 ส่ง Request</button>
                        <button class="btn btn-secondary" onclick="formatJson()">📝 Format</button>
                        <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear</button>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="request-row">
                        <div class="request-left">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Endpoint</label>
                                    <select id="endpoint">
                                        <option value="/api/pdf/preview">POST /api/pdf/preview</option>
                                        <option value="/api/pdf/generate">POST /api/pdf/generate</option>
                                        <option value="/api/pdf/health">GET /api/pdf/health</option>
                                    </select>
                                </div>
                            </div>

                            <div class="endpoint-info">
                                <span class="method-badge" id="methodBadge">POST</span>
                                <span id="fullEndpoint">Loading...</span>
                            </div>

                            <div class="sample-select">
                                <label>📄 ประเภทเอกสาร:</label>
                                <select id="documentType" onchange="loadDocumentType()">
                                    <option value="">-- เลือกประเภท --</option>
                                    <optgroup label="📝 บันทึกข้อความ">
                                        <option value="memoShort">บันทึกข้อความ - เนื้อหาสั้น (1 หน้า)</option>
                                        <option value="memoLong">บันทึกข้อความ - เนื้อหายาว (2-3 หน้า)</option>
                                        <option value="memoTable">บันทึกข้อความ - มีตาราง</option>
                                    </optgroup>
                                    <optgroup label="📤 หนังสือส่งออก">
                                        <option value="outboundShort">หนังสือส่งออก - เนื้อหาสั้น (1 หน้า)</option>
                                        <option value="outboundLong">หนังสือส่งออก - เนื้อหายาว (2-3 หน้า)</option>
                                        <option value="outboundTable">หนังสือส่งออก - มีตาราง</option>
                                    </optgroup>
                                    <optgroup label="📋 หนังสือประทับตรา">
                                        <option value="stampShort">หนังสือประทับตรา - เนื้อหาสั้น</option>
                                        <option value="stampLong">หนังสือประทับตรา - เนื้อหายาว</option>
                                        <option value="stampTable">หนังสือประทับตรา - มีตาราง</option>
                                    </optgroup>
                                    <optgroup label="🏛️ หนังสือกระทรวง">
                                        <option value="ministryShort">หนังสือกระทรวง - เนื้อหาสั้น</option>
                                        <option value="ministryLong">หนังสือกระทรวง - เนื้อหายาว</option>
                                        <option value="ministryTable">หนังสือกระทรวง - มีตาราง</option>
                                    </optgroup>
                                    <optgroup label="📜 หนังสือประกาศ/ระเบียบ/คำสั่ง">
                                        <option value="announceShort">ประกาศ - เนื้อหาสั้น</option>
                                        <option value="announceLong">ประกาศ - เนื้อหายาว</option>
                                        <option value="regulationShort">ระเบียบ - เนื้อหาสั้น</option>
                                        <option value="regulationLong">ระเบียบ - เนื้อหายาว</option>
                                        <option value="commandShort">คำสั่ง - เนื้อหาสั้น</option>
                                        <option value="commandLong">คำสั่ง - เนื้อหายาว</option>
                                        <option value="rulesShort">ข้อบังคับ - เนื้อหาสั้น</option>
                                        <option value="rulesLong">ข้อบังคับ - เนื้อหายาว</option>
                                    </optgroup>
                                </select>
                            </div>
                        </div>

                        <div class="request-right">
                            <label>✏️ Request Body (JSON)</label>
                            <textarea id="requestBody" oninput="updateJsonPreview()"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Response Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>📥 Response</span>
                    <span id="statusText">พร้อมใช้งาน</span>
                </div>
                <div class="panel-body" style="padding: 15px">
                    <div class="response-content">
                        <!-- PDF Preview Section -->
                        <div class="pdf-section">
                            <div class="pdf-section-header">📄 PDF Preview</div>
                            <div class="pdf-section-body">
                                <div class="loading-overlay" id="loading">
                                    <div class="spinner"></div>
                                    <p>กำลังสร้าง PDF...</p>
                                </div>
                                <div class="no-pdf" id="noPdf">
                                    <div class="no-pdf-icon">📄</div>
                                    <div>กดปุ่ม "ส่ง Request" เพื่อสร้าง PDF</div>
                                </div>
                                <iframe id="pdfViewer" style="display: none"></iframe>
                            </div>
                        </div>

                        <!-- JSON Section with Tabs -->
                        <div class="json-section">
                            <div class="json-section-tabs">
                                <button class="json-tab active" onclick="switchJsonTab('request')">📝 Request Preview</button>
                                <button class="json-tab" onclick="switchJsonTab('response')">📋 Response</button>
                            </div>

                            <!-- Request Preview Tab -->
                            <div class="json-tab-content active" id="requestPreviewTab">
                                <div style="padding: 8px 12px; background: #2d3748; display: flex; justify-content: space-between; align-items: center">
                                    <span style="color: #a0aec0; font-size: 12px">Request Body Structure</span>
                                    <span id="jsonStatus" style="font-size: 11px; color: #68d391">✓ Valid</span>
                                </div>
                                <div class="json-preview-body" id="jsonPreview">
                                    <span style="color: #888">เลือกประเภทเอกสาร...</span>
                                </div>
                            </div>

                            <!-- Response Tab -->
                            <div class="json-tab-content" id="responseTab">
                                <textarea id="jsonResponse" readonly placeholder="Response จะแสดงที่นี่..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="status-bar" id="statusBar">
                    <span id="statusMessage">พร้อมใช้งาน - กรุณาส่ง Request</span>
                    <span id="responseTime"></span>
                </div>
            </div>
        </div>

        <script>
            // BookNameId ตามประเภทเอกสาร
            const BOOK_NAME_IDS = {
                officialMemo: "4B3EB169-6203-4A71-A3BD-A442FEAAA91F", // บันทึกข้อความ
                officialDocument: "90F72F0E-528D-4992-907A-F2C6B37AD9A5", // หนังสือภายนอก (ส่งออก)
                regulation: "50792880-F85A-4343-9672-7B61AF828A5B", // หนังสือระเบียบ
                announce: "23065068-BB18-49EA-8CE7-22945E16CB6D", // หนังสือประกาศ
                command: "3FEDE42B-078A-4D2C-9B21-3EAD3E418F3D", // หนังสือคำสั่ง
                rules: "4AB1EC00-9E5E-4113-B577-D8ED46BA7728", // หนังสือข้อบังคับ
                stamp: "AF3E7697-6F7E-4AD8-B76C-E2134DB98747", // หนังสือประทับตรา
                ministry: "4B3EB169-6203-4A71-A3BD-A442FEAAA91F", // หนังสือภายใต้กระทรวง
            };

            // Template ตามประเภทเอกสาร - แบ่งเป็น 3 รูปแบบ (Short, Long, Table)
            // ============================================
            // Common Data: ผู้ลงนาม, เสนอผ่าน, ผู้เรียน
            // ============================================
            const commonSigners = {
                bookSigned: [
                    { relatedNo: "1", prefixName: "นาย", firstname: "ประสิทธิ์", lastname: "พัฒนากิจ", positionName: "ผู้อำนวยการ", departmentName: "สำนักงานพัฒนาธุรกรรมทางอิเล็กทรอนิกส์", email: "prasit@etda.or.th", signatureBase64: "" },
                    { relatedNo: "2", prefixName: "นางสาว", firstname: "อัจฉรีย์", lastname: "สมุทรสาร", positionName: "ผู้ชำนาญการ", departmentName: "กองพัฒนาระบบบริการ", email: "atcharee@etda.or.th", signatureBase64: "" },
                ],
                bookSubmited: [
                    { relatedNo: "1", prefixName: "นาย", firstname: "วิชัย", lastname: "เสนอผ่าน", positionName: "หัวหน้าฝ่ายบริหาร", departmentName: "กองบริหารงานทั่วไป", email: "wichai@etda.or.th" },
                    { relatedNo: "2", prefixName: "นาง", firstname: "สมศรี", lastname: "ตรวจสอบ", positionName: "ผู้จัดการฝ่าย", departmentName: "กองพัฒนาระบบบริการ", email: "somsri@etda.or.th" },
                ],
                bookLearner: [{ relatedNo: "1", prefixName: "นาย", firstname: "สมชาย", lastname: "ใจดี", positionName: "หัวหน้างานพัฒนา", departmentName: "กองพัฒนาระบบบริการ", email: "somchai@etda.or.th" }],
            };

            // Long Content สำหรับทดสอบการขึ้นหน้าใหม่
            const longContent = `        <strong>ย่อหน้าที่ 1:</strong> ด้วยกองพัฒนาระบบบริการ สำนักงานพัฒนาธุรกรรมทางอิเล็กทรอนิกส์ มีความประสงค์ดำเนินการพัฒนาระบบสารบรรณอิเล็กทรอนิกส์แบบครบวงจร เพื่อรองรับการทำงานในยุคดิจิทัล และเพิ่มประสิทธิภาพการบริหารจัดการเอกสารภาครัฐ

        <strong>ย่อหน้าที่ 2:</strong> ระบบสารบรรณอิเล็กทรอนิกส์ดังกล่าว มีคุณสมบัติและความสามารถหลัก ได้แก่ การรับ-ส่งหนังสือราชการผ่านระบบอิเล็กทรอนิกส์ การลงลายมือชื่อดิจิทัล การจัดเก็บและสืบค้นเอกสาร การติดตามสถานะเอกสาร และการรายงานผลการดำเนินงาน

        <strong>ย่อหน้าที่ 3:</strong> ประโยชน์ที่คาดว่าจะได้รับจากการพัฒนาระบบนี้ ได้แก่ ลดระยะเวลาในการรับ-ส่งเอกสาร ลดค่าใช้จ่ายด้านกระดาษและการจัดส่ง เพิ่มความถูกต้องและความน่าเชื่อถือของเอกสาร รองรับการทำงานแบบ Work from Anywhere และสอดคล้องกับนโยบายรัฐบาลดิจิทัล

        <strong>ย่อหน้าที่ 4:</strong> แผนการดำเนินงานแบ่งออกเป็น 4 ระยะ ได้แก่ ระยะที่ 1 การวิเคราะห์และออกแบบระบบ (3 เดือน) ระยะที่ 2 การพัฒนาระบบ (6 เดือน) ระยะที่ 3 การทดสอบระบบ (2 เดือน) และระยะที่ 4 การติดตั้งและใช้งานจริง (1 เดือน) รวมระยะเวลาดำเนินการทั้งสิ้น 12 เดือน

        <strong>ย่อหน้าที่ 5:</strong> งบประมาณที่ใช้ในการดำเนินโครงการ ประกอบด้วย ค่าพัฒนาซอฟต์แวร์ ค่าอุปกรณ์ฮาร์ดแวร์ ค่าบริการคลาวด์ ค่าฝึกอบรมบุคลากร และค่าบำรุงรักษาระบบ โดยใช้งบประมาณจากกองทุนพัฒนาดิจิทัลเพื่อเศรษฐกิจและสังคม

        <strong>ย่อหน้าที่ 6:</strong> คณะทำงานประกอบด้วยบุคลากรจากหลายหน่วยงาน ได้แก่ กองพัฒนาระบบบริการ กองนโยบายและยุทธศาสตร์ กองบริหารงานทั่วไป และผู้เชี่ยวชาญจากภายนอก เพื่อให้การดำเนินงานครอบคลุมทุกมิติ

        <strong>ย่อหน้าที่ 7:</strong> ความเสี่ยงที่อาจเกิดขึ้น ได้แก่ การเปลี่ยนแปลงความต้องการของผู้ใช้ ข้อจำกัดด้านเทคโนโลยี การต่อต้านการเปลี่ยนแปลงจากบุคลากร และข้อจำกัดด้านงบประมาณ ซึ่งได้มีแผนบริหารความเสี่ยงเพื่อรองรับปัญหาที่อาจเกิดขึ้น

        <strong>ย่อหน้าที่ 8:</strong> ตัวชี้วัดความสำเร็จของโครงการ ประกอบด้วย จำนวนเอกสารที่รับ-ส่งผ่านระบบ ความพึงพอใจของผู้ใช้งาน ระยะเวลาในการดำเนินการต่อเอกสาร และอัตราความผิดพลาดในการจัดการเอกสาร

        <strong>ย่อหน้าที่ 9:</strong> การสนับสนุนและการบำรุงรักษาระบบหลังการติดตั้ง จะมีทีมสนับสนุนตลอด 24 ชั่วโมง มีการอัปเดตระบบอย่างสม่ำเสมอ และมีการอบรมทบทวนให้กับผู้ใช้งานอย่างต่อเนื่อง

        <strong>ย่อหน้าที่ 10:</strong> จึงเรียนมาเพื่อโปรดพิจารณาอนุมัติการดำเนินโครงการพัฒนาระบบสารบรรณอิเล็กทรอนิกส์แบบครบวงจร ตามรายละเอียดข้างต้น และหวังเป็นอย่างยิ่งว่าจะได้รับความอนุเคราะห์จากท่าน`;

                    documentSub: { bookName: "ข้อบังคับ", bookTitle: "[SHORT] ข้อบังคับสำนักงานพัฒนาธุรกรรมฯ", bookNo: "", dateThai: "8 มกราคม พ.ศ. 2569", department: "สพธอ.", divisionName: "", year: "พ.ศ. 2569", bookContent: { subject: "ว่าด้วยจรรยาบรรณพนักงาน", content: "        ข้อ 1 พนักงานต้องปฏิบัติหน้าที่ด้วยความซื่อสัตย์", contentType: "html" } },

                    documentSub: { bookName: "ข้อบังคับ", bookTitle: "[LONG] ข้อบังคับสำนักงานพัฒนาธุรกรรมฯ", bookNo: "", dateThai: "8 มกราคม พ.ศ. 2569", department: "สพธอ.", divisionName: "", year: "พ.ศ. 2569", bookContent: { subject: "ว่าด้วยจรรยาบรรณพนักงาน", content: longContent, contentType: "html" } },
                    ...commonSigners,
                },
            };

            // Current state
            let currentTemplate = null;

            // Load document type
            function loadDocumentType() {
                const docType = document.getElementById("documentType").value;
                if (docType && documentTemplates[docType]) {
                    currentTemplate = JSON.parse(JSON.stringify(documentTemplates[docType]));
                    document.getElementById("requestBody").value = JSON.stringify(currentTemplate, null, 2);
                    updateJsonPreview();
                }
            }

            // Get base URL from current location
            function getBaseUrl() {
                return window.location.origin;
            }

            // Update endpoint display
            document.getElementById("endpoint").addEventListener("change", function () {
                const endpoint = this.value;
                const isGet = endpoint.includes("health");
                document.getElementById("methodBadge").textContent = isGet ? "GET" : "POST";
                document.getElementById("fullEndpoint").textContent = getBaseUrl() + endpoint;
                document.getElementById("requestBody").disabled = isGet;
            });

            // Format JSON
            function formatJson() {
                const textarea = document.getElementById("requestBody");
                try {
                    const parsed = JSON.parse(textarea.value);
                    textarea.value = JSON.stringify(parsed, null, 2);
                    updateJsonPreview();
                } catch (e) {
                    alert("Invalid JSON: " + e.message);
                }
            }

            // Update JSON preview
            function updateJsonPreview() {
                const textarea = document.getElementById("requestBody");
                const preview = document.getElementById("jsonPreview");
                const status = document.getElementById("jsonStatus");

                try {
                    const parsed = JSON.parse(textarea.value);
                    preview.innerHTML = syntaxHighlight(JSON.stringify(parsed, null, 2));
                    status.textContent = "✓ Valid";
                    status.style.color = "#68d391";
                } catch (e) {
                    preview.innerHTML = `<span style="color: #fc8181">Invalid JSON: ${e.message}</span>`;
                    status.textContent = "✗ Invalid";
                    status.style.color = "#fc8181";
                }
            }

            // Syntax highlight
            function syntaxHighlight(json) {
                json = json.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                    let cls = "json-number";
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = "json-key";
                        } else {
                            cls = "json-string";
                        }
                    } else if (/true|false/.test(match)) {
                        cls = "json-boolean";
                    } else if (/null/.test(match)) {
                        cls = "json-null";
                    }
                    return '<span class="' + cls + '">' + match + "</span>";
                });
            }

            // Switch JSON tabs
            function switchJsonTab(tabName) {
                document.querySelectorAll(".json-tab").forEach((tab) => tab.classList.remove("active"));
                document.querySelectorAll(".json-tab-content").forEach((content) => content.classList.remove("active"));

                if (tabName === "request") {
                    document.querySelector('.json-tab[onclick*="request"]').classList.add("active");
                    document.getElementById("requestPreviewTab").classList.add("active");
                } else {
                    document.querySelector('.json-tab[onclick*="response"]').classList.add("active");
                    document.getElementById("responseTab").classList.add("active");
                }
            }

            // Clear all
            function clearAll() {
                document.getElementById("requestBody").value = "";
                document.getElementById("jsonResponse").value = "";
                document.getElementById("pdfViewer").src = "";
                document.getElementById("pdfViewer").style.display = "none";
                document.getElementById("noPdf").style.display = "flex";
                document.getElementById("statusBar").className = "status-bar";
                document.getElementById("statusMessage").textContent = "พร้อมใช้งาน - กรุณาส่ง Request";
                document.getElementById("statusText").textContent = "พร้อมใช้งาน";
                document.getElementById("responseTime").textContent = "";
                document.getElementById("documentType").value = "";
                currentTemplate = null;
                updateJsonPreview();
            }

            // Send request
            async function sendRequest() {
                const endpoint = document.getElementById("endpoint").value;
                const isGet = endpoint.includes("health");
                const body = document.getElementById("requestBody").value;
                const statusBar = document.getElementById("statusBar");
                const loading = document.getElementById("loading");
                const noPdf = document.getElementById("noPdf");
                const pdfViewer = document.getElementById("pdfViewer");

                // Show loading
                loading.classList.add("active");
                noPdf.style.display = "none";
                pdfViewer.style.display = "none";
                document.getElementById("statusText").textContent = "กำลังประมวลผล...";

                const startTime = Date.now();

                try {
                    const options = {
                        method: isGet ? "GET" : "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                    };

                    if (!isGet) {
                        options.body = body;
                    }

                    const response = await fetch(getBaseUrl() + endpoint, options);
                    const elapsed = Date.now() - startTime;

                    const data = await response.json();

                    // Hide loading
                    loading.classList.remove("active");

                    // Display JSON response
                    document.getElementById("jsonResponse").value = JSON.stringify(data, null, 2);
                    document.getElementById("responseTime").textContent = `⏱️ ${elapsed}ms`;

                    // Auto switch to response tab
                    switchJsonTab("response");

                    // Update status bar
                    if (response.ok && data.isOK) {
                        statusBar.className = "status-bar success";
                        document.getElementById("statusMessage").textContent = `✅ สำเร็จ! Status: ${response.status}`;
                        document.getElementById("statusText").textContent = "✅ สำเร็จ";

                        // Try to display PDF if available
                        let pdfData = data.data;
                        console.log("PDF data length:", pdfData ? pdfData.length : 0);

                        if (pdfData && typeof pdfData === "string" && pdfData.length > 100) {
                            // Remove data URL prefix if present (handles both cases: with and without prefix)
                            const base64Prefix = "data:application/pdf;base64,";
                            if (pdfData.startsWith(base64Prefix)) {
                                pdfData = pdfData.substring(base64Prefix.length);
                                console.log("Removed base64 prefix from PDF data");
                            }

                            // Create blob from base64 for better browser compatibility
                            try {
                                const byteCharacters = atob(pdfData);
                                const byteNumbers = new Array(byteCharacters.length);
                                for (let i = 0; i < byteCharacters.length; i++) {
                                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                                }
                                const byteArray = new Uint8Array(byteNumbers);
                                const blob = new Blob([byteArray], { type: "application/pdf" });
                                const blobUrl = URL.createObjectURL(blob);

                                pdfViewer.src = blobUrl;
                                pdfViewer.style.display = "block";
                                noPdf.style.display = "none";
                                console.log("PDF blob URL created:", blobUrl);
                            } catch (e) {
                                console.error("Error creating PDF blob:", e);
                                // Fallback to data URL
                                pdfViewer.src = "data:application/pdf;base64," + pdfData;
                                pdfViewer.style.display = "block";
                                noPdf.style.display = "none";
                            }
                        } else {
                            noPdf.innerHTML = '<div class="no-pdf-icon">📋</div><div>Response ไม่มี PDF data</div>';
                            noPdf.style.display = "flex";
                        }
                    } else {
                        statusBar.className = "status-bar error";
                        document.getElementById("statusMessage").textContent = `❌ Error! Status: ${response.status} | ${data.message || "Unknown error"}`;
                        document.getElementById("statusText").textContent = "❌ Error";
                        noPdf.innerHTML = '<div class="no-pdf-icon">❌</div><div>เกิดข้อผิดพลาด</div>';
                        noPdf.style.display = "flex";
                    }
                } catch (error) {
                    // Hide loading
                    loading.classList.remove("active");

                    statusBar.className = "status-bar error";
                    document.getElementById("statusMessage").textContent = `❌ Network Error: ${error.message}`;
                    document.getElementById("statusText").textContent = "❌ Error";
                    document.getElementById("jsonResponse").value = JSON.stringify({ error: error.message }, null, 2);
                    document.getElementById("responseTime").textContent = "";

                    noPdf.innerHTML = '<div class="no-pdf-icon">🔌</div><div>ไม่สามารถเชื่อมต่อ Server ได้<br><small>ตรวจสอบว่า Server ทำงานอยู่ที่ ' + getBaseUrl() + "</small></div>";
                    noPdf.style.display = "flex";
                }
            }

            document.addEventListener("DOMContentLoaded", function () {
                // Update endpoint display with current URL
                const endpoint = document.getElementById("endpoint").value;
                document.getElementById("fullEndpoint").textContent = getBaseUrl() + endpoint;
                updateJsonPreview();
            });
        </script>
    </body>
